<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Living Terrarium - Setup</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: #0b110e;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #131c17;
    border: 1px solid #22372c;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  h1 {
    margin: 0 0 6px 0;
    color: #5eead4;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .tagline {
    font-size: 13px;
    color: #94a3b8;
    margin: 0;
  }
  .field {
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    margin-bottom: 8px;
  }
  input[type="text"], input[type="date"] {
    width: 100%;
    padding: 12px 14px;
    background: #080d0a;
    border: 1px solid #253d31;
    border-radius: 8px;
    color: #f8fafc;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, input[type="date"]:focus {
    border-color: #5eead4;
  }
  .date-row {
    display: flex;
    gap: 12px;
  }
  .date-row .field {
    flex: 1;
    margin-bottom: 0;
  }
  .vibe-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .vibe-option {
    background: #080d0a;
    border: 1px solid #253d31;
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
  }
  .vibe-option:hover {
    border-color: #3b604e;
  }
  .vibe-option.active {
    background: #182e24;
    border-color: #5eead4;
  }
  .vibe-name {
    font-size: 13px;
    font-weight: 600;
    color: #f1f5f9;
    margin-bottom: 2px;
  }
  .vibe-sub {
    font-size: 11px;
    color: #94a3b8;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 26px;
    background: #1d4335;
    border: 1px solid #3d8065;
    color: #5eead4;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .btn:hover {
    background: #255845;
    color: #ffffff;
    box-shadow: 0 4px 15px rgba(94, 234, 212, 0.2);
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>The Living Terrarium</h1>
    <p class="tagline">Milestone Countdown Engine</p>
  </div>

  <div class="field">
    <label>Goal Name</label>
    <input type="text" id="goalTitle" placeholder="e.g. Finish Capstone Thesis" value="Finish Capstone Thesis">
  </div>

  <div class="field">
    <div class="date-row">
      <div class="field">
        <label>Start Date</label>
        <input type="date" id="startDate" value="2026-10-01">
      </div>
      <div class="field">
        <label>Deadline</label>
        <input type="date" id="targetDate" value="2026-12-15">
      </div>
    </div>
  </div>

  <div class="field" style="margin-bottom: 0;">
    <label>Goal Type / Focus</label>
    <div class="vibe-grid">
      <div class="vibe-option active" data-species="azalea" onclick="selectVibe(this, 'azalea')">
        <div class="vibe-name">Scholarship & Craft</div>
        <div class="vibe-sub">Deep study & writing</div>
      </div>
      <div class="vibe-option" data-species="poppy" onclick="selectVibe(this, 'poppy')">
        <div class="vibe-name">High Difficulty</div>
        <div class="vibe-sub">Code & technical rigor</div>
      </div>
      <div class="vibe-option" data-species="edelweiss" onclick="selectVibe(this, 'edelweiss')">
        <div class="vibe-name">Grit & Discipline</div>
        <div class="vibe-sub">Endurance & habit streaks</div>
      </div>
      <div class="vibe-option" data-species="coreopsis" onclick="selectVibe(this, 'coreopsis')">
        <div class="vibe-name">Sprint & Launch</div>
        <div class="vibe-sub">Project release & sprints</div>
      </div>
    </div>
  </div>

  <a class="btn" id="downloadBtn" href="Azalea_Stage_3_Bloom.jpg" download>Download Lock Screen Wallpaper</a>
</div>

<script>
  // Image Library mapping for all 4 species across the 4 stages
  const imageLibrary = {
    azalea: {
      1: "Azalea_Stage_1_Seedbed.jpg",
      2: "Azalea_Stage_2_Growth.jpg",
      3: "Azalea_Stage_3_Bloom.jpg", // The approved blooming azalea
      4: "Azalea_Stage_4_Harvest.jpg"
    },
    poppy: {
      1: "Poppy_Stage_1_Seedbed.jpg",
      2: "Poppy_Stage_2_Growth.jpg",
      3: "Poppy_Stage_3_Bloom.jpg",
      4: "Poppy_Stage_4_Harvest.jpg"
    },
    edelweiss: {
      1: "Edelweiss_Stage_1_Seedbed.jpg",
      2: "Edelweiss_Stage_2_Growth.jpg",
      3: "Edelweiss_Stage_3_Bloom.jpg",
      4: "Edelweiss_Stage_4_Harvest.jpg"
    },
    coreopsis: {
      1: "Coreopsis_Stage_1_Seedbed.jpg",
      2: "Coreopsis_Stage_2_Growth.jpg",
      3: "Coreopsis_Stage_3_Bloom.jpg",
      4: "Coreopsis_Stage_4_Harvest.jpg"
    }
  };

  let activeSpecies = "azalea";

  function selectVibe(el, species) {
    document.querySelectorAll('.vibe-option').forEach(opt => opt.classList.remove('active'));
    el.classList.add('active');
    activeSpecies = species;
    updateDownloadLink();
  }

  function updateDownloadLink() {
    const startVal = document.getElementById('startDate').value;
    const endVal = document.getElementById('targetDate').value;
    
    if (!startVal || !endVal) return;

    const start = new Date(startVal);
    const end = new Date(endVal);
    const today = new Date(); // Uses client's live current date

    const totalDuration = Math.max(1, end - start);
    const elapsed = today - start;
    let progress = Math.min(100, Math.max(0, Math.round((elapsed / totalDuration) * 100)));

    let stage = 1;
    if (progress > 75) {
      stage = 4;
    } else if (progress > 50) {
      stage = 3;
    } else if (progress > 25) {
      stage = 2;
    } else {
      stage = 1;
    }

    const targetFile = imageLibrary[activeSpecies][stage];
    const downloadBtn = document.getElementById('downloadBtn');
    downloadBtn.href = targetFile;
    downloadBtn.setAttribute('download', targetFile);
  }

  document.getElementById('startDate').addEventListener('change', updateDownloadLink);
  document.getElementById('targetDate').addEventListener('change', updateDownloadLink);

  // Initialize on page load
  updateDownloadLink();
</script>

</body>
</html>
